name: Build & Push

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      version:
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.meta.outputs.version }}
      image-tag: ${{ steps.meta.outputs.image-tag }}

    steps:
      - uses: actions/checkout@v6

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tags & version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="${INPUT_VERSION:-$SHORT_SHA}"

          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "tags=ghcr.io/osthelia/riotrelay:latest,ghcr.io/osthelia/riotrelay:${VERSION}" >> "$GITHUB_OUTPUT"
            echo "image-tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/osthelia/riotrelay:preprod" >> "$GITHUB_OUTPUT"
            echo "image-tag=preprod" >> "$GITHUB_OUTPUT"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          push: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            RELEASE_VERSION=${{ steps.meta.outputs.version }}