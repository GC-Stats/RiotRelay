name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

jobs:
  run-checks:
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/checks.yml

  build:
    needs: [run-checks]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      version: ${{ github.event.release.tag_name }}
    secrets: inherit