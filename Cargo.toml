# Osthelia — RiotRelay crate manifest
#
# Dependencies of the Riot match caching relay (axum, reqwest, sqlx/PostgreSQL).
#
# Copyright (c) 2026 Osthelia — RiotRelay
# License: https://github.com/Osthelia/RiotRelay/blob/main/LICENSE.md (Osthelia License v1.0)
# Repository: https://github.com/Osthelia/RiotRelay

[package]
name = "riot_relay"
version = "1.0.0"
edition = "2024"
license-file = "LICENSE.md"
repository = "https://github.com/Osthelia/RiotRelay"

[dependencies]
axum = "0.8"
dotenvy = "0.15"
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres"] }
sha2 = "0.10"

[features]
# One-shot MariaDB -> PostgreSQL migration tool (src/bin/migrate_mariadb.rs).
# Kept optional so the server build doesn't pull in the MySQL driver.
migrate = ["sqlx/mysql"]

[[bin]]
name = "riot_relay"
path = "src/main.rs"

[[bin]]
name = "migrate_mariadb"
path = "src/bin/migrate_mariadb.rs"
required-features = ["migrate"]
